<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#3f076b" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>
  </defs>
  <!-- Sleek dark background squircle -->
  <rect width="450" height="450" x="31" y="31" rx="110" fill="#0d0e12" stroke="rgba(247, 37, 133, 0.08)" stroke-width="3" />
  
  <!-- Overlapping Solid Shapes forming a Checkmark -->
  <!-- Shorter left leg (Deep Purple) -->
  <rect x="130" y="240" width="80" height="150" rx="40" transform="rotate(-45 130 240)" fill="url(#purpleGrad)" />
  
  <!-- Longer right leg (Neon Magenta) overlapping on top -->
  <rect x="200" y="370" width="80" height="260" rx="40" transform="rotate(-135 200 370)" fill="url(#magentaGrad)" />
</svg>
